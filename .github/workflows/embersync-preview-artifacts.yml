name: EmberSync preview artifacts
on:
  workflow_dispatch:
  push:
    branches: [embersync-v2-local-preview-20261007]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Linux display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk8.6 xvfb
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -c "import tkinter; print(tkinter.TkVersion)"
      - run: python -m pip install lupa==2.8
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name EmberSync-Preview --osx-bundle-identifier org.rainingembers.EmberSyncPreview --hidden-import sync --hidden-import device --hidden-import cryptography --hidden-import keyring --distpath releases/native --workpath .build/native --specpath .build desktop/app.py
      - name: Windows setup
        if: runner.os == 'Windows'
        run: |
          $payload = (Resolve-Path 'releases/native/EmberSync-Preview.exe').Path
          python -m PyInstaller --noconfirm --onefile --windowed --name EmberSync-Preview-Setup --add-data "${payload};." --distpath releases/native --workpath .build/setup --specpath .build desktop/windows_installer.py
      - name: Package native installer and run safe bundled self-test
        run: python scripts/package_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: EmberSync-preview-${{ runner.os }}-${{ runner.arch }}-part1
          path: releases/delivery/part1/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: EmberSync-preview-${{ runner.os }}-${{ runner.arch }}-part2
          path: releases/delivery/part2/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: EmberSync-preview-${{ runner.os }}-${{ runner.arch }}-part3
          path: releases/delivery/part3/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: EmberSync-preview-${{ runner.os }}-${{ runner.arch }}-part4
          path: releases/delivery/part4/
          if-no-files-found: ignore
          retention-days: 3
